<body>
    <div class="header" id="myHeader">
        <nav class="navbar">
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>

        </nav>

    <div id="admin-content">
        <div id="left-container" class="admin-card">
            <h2>Categorie Toevoegen</h2>
            <form action="/action_page.php">
                <label for="cat-titel">Titel:</label>
                <input type="text" id="cat-titel" name="titel" placeholder="Jouw titel...">

                <label for="cat-description">Description:</label>
                <textarea id="cat-description" name="description" rows="6" placeholder="Jouw description..."></textarea>

                <label for="cat-imagefile">Afbeelding:</label>
                <input type="file" id="cat-imagefile" name="imagefile">

                <input type="submit" value="Submit">
            </form>
        </div>

        <div id="right-container" class="admin-card">
            <h2>Gerecht Toevoegen</h2>
            <form action="/action_page.php">
                <label for="gerecht-titel">Gerecht Titel:</label>
                <input type="text" id="gerecht-titel" name="titel" placeholder="Jouw titel...">

                <label for="gerecht-description">Description:</label>
                <textarea id="gerecht-description" name="description" rows="6" placeholder="Jouw description..."></textarea>

                <label for="gerecht-imagefile">Afbeelding:</label>
                <input type="file" id="gerecht-imagefile" name="imagefile">

                <label for="category">Kies een categorie:</label>
                <select name="category" id="category">
                    <option value="category1">Category1</option>
                    <option value="category2">Category2</option>
                    <option value="category3">Category3</option>
                </select>

                <input type="submit" value="Submit">
            </form>
        </div>
